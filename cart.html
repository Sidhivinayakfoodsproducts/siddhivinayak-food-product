<!DOCTYPE html>

<html lang="mr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Your Cart | Siddhivinayak</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<div class="top-strip">

  <div>📍 Maharashtra</div>

  <div>📞 +91 9881013475</div>

</div>


<header class="header">

  <a href="index.html" class="brand">

    <div class="brand-logo">

      <span>SV</span>

    </div>

    <div>

      <strong>सिद्धिविनायक</strong>

      <small>
        FOODS & PRODUCTS
      </small>

    </div>

  </a>


  <nav class="desktop-nav">

    <a href="index.html">
      Home
    </a>

    <a href="shop.html">
      Shop
    </a>

  </nav>


  <div class="header-actions">

    <span class="cart-btn">
      🛒
      <span id="cart-count">0</span>
    </span>

  </div>

</header>


<main class="cart-page">

  <h1>
    🛒 Your Cart
  </h1>


  <div id="cart-items"></div>


  <div class="cart-summary">

    <p>
      Total Amount
    </p>

    <div
      class="cart-total"
    >
      ₹<span id="cart-total">0</span>
    </div>


    <br>


    <button
      class="btn btn-red"
      onclick="checkout()"
    >
      Order on WhatsApp →
    </button>

  </div>

</main>


<footer>

  <div class="copyright">

    © 2026 Siddhivinayak Foods & Products

  </div>

</footer>


<script src="script.js"></script>

</body>

</html>
